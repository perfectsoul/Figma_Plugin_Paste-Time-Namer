<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; padding: 16px; color: var(--figma-color-text); background: var(--figma-color-bg); font-size: 12px; }
    h1 { margin: 0 0 8px; font-size: 14px; }
    p { margin: 0 0 14px; line-height: 1.5; color: var(--figma-color-text-secondary); }
    .row { display: flex; gap: 8px; }
    button { flex: 1; border: 0; border-radius: 6px; padding: 9px 10px; cursor: pointer; font-weight: 600; }
    #toggle { color: var(--figma-color-text-onbrand); background: var(--figma-color-bg-brand); }
    #rename { color: var(--figma-color-text); background: var(--figma-color-bg-secondary); }
    #status { margin-top: 12px; min-height: 18px; color: var(--figma-color-text-secondary); }
  </style>
</head>
<body>
  <h1>Paste Time Namer</h1>
  <p>이 창을 열어 둔 동안 붙여넣은 이미지 레이어를 로컬 시각으로 자동 명명합니다.</p>
  <div class="row">
    <button id="toggle">자동 변경 중지</button>
    <button id="rename">선택 항목 지금 명명</button>
  </div>
  <div id="status">감시 준비 중…</div>
  <script>
    let enabled = true;
    const toggle = document.getElementById("toggle");
    const status = document.getElementById("status");

    toggle.onclick = () => {
      enabled = !enabled;
      parent.postMessage({ pluginMessage: { type: "set-enabled", enabled } }, "*");
    };
    document.getElementById("rename").onclick = () => {
      parent.postMessage({ pluginMessage: { type: "rename-selection" } }, "*");
    };

    onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (!message) return;
      if (message.type === "status") {
        enabled = message.enabled;
        toggle.textContent = enabled ? "자동 변경 중지" : "자동 변경 시작";
        status.textContent = enabled ? "이미지 붙여넣기를 감시하고 있습니다." : "감시가 중지되었습니다.";
      } else if (message.type === "renamed") {
        status.textContent = message.count
          ? `${message.count}개 레이어를 ${message.timestamp}(으)로 명명했습니다.`
          : "선택 항목에서 이미지 레이어를 찾지 못했습니다.";
      }
    };
  </script>
</body>
</html>
